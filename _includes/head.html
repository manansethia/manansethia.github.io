<meta name="viewport" content="width=device-width, initial-scale=1.0">


<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
</script>



<!-- Theme flash prevention — inline and intentionally tiny. -->
<script>
  (function () {
    try {
      var theme = localStorage.getItem("theme");
      if (theme === "dark") document.documentElement.classList.add("dark-mode");
      if (theme === "royal") document.documentElement.classList.add("royal-mode");
    } catch (error) { /* Storage may be disabled. */ }
  })();
</script>
<style>
html{background:#fffbeb}
html.dark-mode{background:#120c00;color:#fdfdfd}
html.royal-mode{background:#0d0d0c;color:#fdfdfd}
</style>

<!-- CSS: render-blocking (intentional — ensures full design before paint) -->
