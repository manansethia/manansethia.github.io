{% include base_path %}

<meta charset="utf-8">

{% include seo.html %}

<!-- ✅ Canonical Tag -->
<link rel="canonical" href="{{ site.url }}{{ page.url | replace:'index.html','' | absolute_url }}" />

<!-- ✅ JSON-LD Schema with custom domain -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": "Manan Sethia",
  "url": "https://manansethia.com",
  "sameAs": [
    "https://github.com/manansethia",
    "https://linkedin.com/in/manan-sethia/"
  ]
}
</script>

<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">

<!-- http://t.co/dKP3o1e -->
<meta name="HandheldFriendly" content="True">
<meta name="MobileOptimized" content="320">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
</script>

<!-- For all browsers -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/main.css">
<link rel="icon" href="/favicon.ico">
