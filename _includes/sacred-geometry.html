<div id="sacred-geometry-overlay"></div>

<style>
  #sacred-geometry-overlay {
    position: absolute;
    top: 0; left: 0; width: 100%;
    z-index: -2;
    pointer-events: none;
    overflow: hidden;
    /* Single GPU layer for the WHOLE sigil overlay. Children inherit it
       instead of each .sg-shape promoting itself separately (was N layers
       for N sigils -> GPU memory pressure -> long-scroll jitter). */
    transform: translateZ(0);
    will-change: transform;
    contain: strict;
  }
  .sg-shape {
    position: absolute;
    stroke: #8a5a0f; /* Much darker brown for light mode */
    color: #8a5a0f;
    fill: none;
    stroke-width: 0.6px;
    opacity: 0.15; /* Dim static container opacity */
    /* will-change removed: per-shape promotion was creating 1 GPU layer per
       sigil. Parent overlay is now the single composite layer. */
  }
  
  .dark-mode .sg-shape {
    stroke: #ffebb8;
    color: #ffebb8;
    opacity: 0.18;
  }

  .royal-mode .sg-shape {
    stroke: #e8ecf1;
    color: #e8ecf1;
    opacity: 0.22;
  }
  
  /* The static background SVG styling */
  .sg-glow-path {
    fill: none;
    stroke: currentColor;
    stroke-width: 1px;
    opacity: 0.7; /* Internal path opacity to blend with shape container */
  }
</style>

<!-- Load the sigils JS -->
<script src="{{ '/assets/js/occult-sigils.js' | relative_url }}" defer></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
    const overlay = document.getElementById('sacred-geometry-overlay');
    if (!overlay) return;

    /* Check if OCCULT_SIGILS loaded securely, fallback to empty in worst-case delay */
    const generators = (typeof OCCULT_SIGILS !== 'undefined' && OCCULT_SIGILS.length) ? OCCULT_SIGILS : [];

    let lastPopulatedY = 250;
    let isLeft = true;
    /* Cap total sigils to bound DOM size + GPU work on very long pages. */
    const MAX_SIGILS = 60;
    
    /* Dynamically stamps SVG objects down the page height.
       NOTE: overlay's own height contributes to body.scrollHeight (it's
       position:absolute inside body). If we measured with overlay still at
       its old height, page would only ever grow. Caller now zeros overlay
       before measuring (see ResizeObserver below). */
    const populateToHeight = (targetHeight) => {
        /* Expand the literal height of the overlay container perfectly */
        overlay.style.height = targetHeight + 'px';

        while (lastPopulatedY < targetHeight - 350 && overlay.childElementCount < MAX_SIGILS) {
            let div = document.createElement('div');
            div.className = 'sg-shape';
            
            /* Scaled back to original preferred size */
            let size = Math.floor(250 + Math.random() * 100); 
            if (window.innerWidth >= 1440) {
               size = Math.floor(380 + Math.random() * 160); /* ultra-large monitors */
            } else if (window.innerWidth < 768) {
               size = Math.floor(150 + Math.random() * 60); /* smaller phones/tablets */
            } else if (window.innerWidth < 1024) {
               size = Math.floor(190 + Math.random() * 70); /* smaller laptops */
            }
            
            div.style.width = size + 'px';
            div.style.height = size + 'px';
            div.style.top = lastPopulatedY + 'px';
            
            let edgeOffset = `-${size * 0.4}px`;
            if (isLeft) { 
                div.style.left = edgeOffset; 
            } else { 
                div.style.right = edgeOffset; 
            }
            
            /* Randomly rotate the geometries to blend them more seamlessly over the background */
            div.style.transform = `rotate(${Math.random() * 360}deg)`;
            
            let genSVG = generators[Math.floor(Math.random() * generators.length)];
            
            /* Animation logic is pre-embedded per path recursively in the python generation */
            div.innerHTML = genSVG;
            
            overlay.appendChild(div);
            
            isLeft = !isLeft;
            /* Densify spawn interval */
            lastPopulatedY += Math.floor(500 + Math.random() * 300); 
        }
    };

    /* Measure body content height EXCLUDING overlay itself. Without this the
       overlay would lock body.scrollHeight at the max-ever value, preventing
       page from shrinking on collapse (mrida pdf close, stack close, etc). */
    const measureContentHeight = () => {
        const prev = overlay.style.height;
        overlay.style.height = '0px';
        const h = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight);
        overlay.style.height = prev;
        return h;
    };

    /* Use ResizeObserver to detect layout flashes, image loads, and expanding pages
       Throttled via rAF to prevent forced reflow storms */
    let _sgRaf = false;
    const ro = new ResizeObserver(() => {
        if (_sgRaf) return;
        _sgRaf = true;
        requestAnimationFrame(() => {
            _sgRaf = false;
            populateToHeight(measureContentHeight());
        });
    });

    if (document.body) ro.observe(document.body);
    if (document.documentElement) ro.observe(document.documentElement);

    /* Explicit initial fire */
    populateToHeight(measureContentHeight());
});
</script>
