<style>

    .author__urls {
      z-index: auto !important;
      background: transparent !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      border: 0 !important;
      box-shadow: none !important;
    }
  }

  /* Dark mode override (desktop reset above still applies via cascade) */
  .dark-mode .author__urls {
    background: linear-gradient(135deg, rgba(80, 50, 0, 0.8), rgba(40, 25, 0, 0.6)) !important;
    backdrop-filter: blur(16px) saturate(180%) !important;
    -webkit-backdrop-filter: blur(16px) saturate(180%) !important;
    border: 2px solid rgba(255, 210, 120, 0.45) !important;
  }

  @media (min-width: 57.8125em) {
    .dark-mode .author__urls {
      background: transparent !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      border: 0 !important;

  }

    -webkit-backdrop-filter: blur(16px) saturate(180%) !important;

  /* ── Jump to Top Button ── */
  .jump-to-top {
    position: fixed;
    bottom: 95px;
    right: 20px;
    z-index: 1000;
    background: none !important;
    border: none !important;
    cursor: pointer;
    padding: 0;
    width: 55px;
    height: 55px;
    opacity: 0 !important;
    visibility: hidden;
    pointer-events: none !important;
    transform: translateY(8px);
    transition: opacity 0.3s ease, transform 0.3s ease, visibility 0.3s ease;
  }

  .jump-to-top.visible {
    opacity: 1 !important;
    visibility: visible;
    pointer-events: auto !important;
    transform: translateY(0);
  }

  .jump-to-top .jtt-container {
    width: 100%;
    height: 100%;
    border-radius: 16px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background-color 0.4s ease, border-color 0.3s ease, transform 0.2s ease;
    background: linear-gradient(135deg, rgba(229, 149, 0, 0.7), rgba(255, 188, 66, 0.4));
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1), inset 0 1px 1px rgba(255, 255, 255, 0.4);
    border: 1.5px solid rgba(255, 255, 255, 0.4);
  }

  .jump-to-top .jtt-container:hover {
    transform: translateY(-2px);
  }

  .jump-to-top .jtt-arrow {
    width: 22px;
    height: 22px;
    stroke: #fff7dc;
    stroke-width: 2.5;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    transition: stroke 0.3s ease;
  }

  .dark-mode .jump-to-top .jtt-container {
    background: linear-gradient(135deg, rgba(80, 50, 0, 0.8), rgba(40, 25, 0, 0.6));
    border: 1.5px solid rgba(255, 230, 196, 0.2);
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.05);
  }

  .dark-mode .jump-to-top .jtt-arrow {
    stroke: #ffe6c4;
  }
</style>

<script data-cfasync="false">
  (function () {
    try {
      if (localStorage.getItem('theme') === 'dark') {
        document.documentElement.classList.add('dark-mode');
      }
    } catch (e) { }
  })();
</script>

<button id="jump-to-top" class="jump-to-top" aria-label="Jump to Top">
  <div class="jtt-container">
    <svg class="jtt-arrow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
      <polyline points="18 15 12 9 6 15"></polyline>
    </svg>
  </div>
</button>

<button id="theme-toggle" class="theme-toggle" aria-label="Toggle Dark Mode">
  <div class="sun-moon-container">
    <svg class="sun icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="5"></circle>
      <line x1="12" y1="1" x2="12" y2="3"></line>
      <line x1="12" y1="21" x2="12" y2="23"></line>
      <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
      <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
      <line x1="1" y1="12" x2="3" y2="12"></line>
      <line x1="21" y1="12" x2="23" y2="12"></line>
      <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
      <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
    </svg>
    <svg class="moon icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
    </svg>
  </div>
</button>

<script data-cfasync="false">
  const themeToggle = document.getElementById("theme-toggle");
  const sun = document.querySelector(".sun");
  const moon = document.querySelector(".moon");

  function updateIcons() {
    const isDark = document.documentElement.classList.contains("dark-mode");
    sun.classList.toggle("visible", !isDark);
    moon.classList.toggle("visible", isDark);
  }

  updateIcons();

  themeToggle.addEventListener("click", function () {
    document.documentElement.classList.toggle("dark-mode");
    localStorage.setItem(
      "theme",
      document.documentElement.classList.contains("dark-mode") ? "dark" : "light"
    );
    updateIcons();
  });

  document.getElementById("jump-to-top").addEventListener("click", function () {
    if (window.jQuery) {
      $("html, body").animate({ scrollTop: 0 }, 700, "swing");
    } else {
      window.scrollTo({ top: 0, behavior: "smooth" });
    }
  });

  /* Show jump-to-top only when: page is scrollable AND not at the very top */
  var jttBtn = document.getElementById("jump-to-top");
  function updateJtt() {
    var pageIsScrollable = document.body.scrollHeight > window.innerHeight;
    var notAtTop = window.scrollY > 0;
    if (pageIsScrollable && notAtTop) {
      jttBtn.classList.add("visible");
    } else {
      jttBtn.classList.remove("visible");
    }
  }
  /* Defer slightly so browser scroll-restoration finishes before we check */
  setTimeout(updateJtt, 100);
  window.addEventListener("scroll", updateJtt, { passive: true });
</script>
<!-- END THEME TOGGLE BUTTON -->
