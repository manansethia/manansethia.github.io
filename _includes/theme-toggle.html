<canvas id="matrix-rain" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; pointer-events: none; filter: blur(1px); -webkit-filter: blur(1px);"></canvas>

<button id="jump-to-top" class="jump-to-top" aria-label="Jump to Top">

<button id="theme-toggle" class="theme-toggle" aria-label="Toggle Dark Mode">
  <div class="sun-moon-container">
    <svg class="sun icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="5"></circle>
      <line x1="12" y1="1" x2="12" y2="3"></line>

      <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>

    </svg>

    </svg>
  </div>

<script data-cfasync="false">
  (function () {
    var html = document.documentElement;
    var themeToggle = document.getElementById("theme-toggle");
    var sun = document.querySelector(".sun");
    var moon = document.querySelector(".moon");

    function updateIcons() {
      var isDark = html.classList.contains("dark-mode");
      sun.classList.toggle("visible", !isDark);
      moon.classList.toggle("visible", isDark);
    }

    updateIcons();

    themeToggle.addEventListener("click", function () {
      html.classList.toggle("dark-mode");
      localStorage.setItem(
        "theme",
        html.classList.contains("dark-mode") ? "dark" : "light"
      );
      updateIcons();
    });

    /* ── Jump to Top ── */
    var jttBtn = document.getElementById("jump-to-top");

    jttBtn.addEventListener("click", function () {
      /* Use native smooth scroll — far lighter than jQuery animate on mobile */
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    /* Show/hide jump-to-top button — throttled via requestAnimationFrame */
    var _jttRafPending = false;
    function updateJtt() {
      if (_jttRafPending) return;
      _jttRafPending = true;
      requestAnimationFrame(function () {
        _jttRafPending = false;
        var pageIsScrollable = document.body.scrollHeight > window.innerHeight;
        var notAtTop = window.scrollY > 0;
        jttBtn.classList.toggle("visible", pageIsScrollable && notAtTop);
      });
    }

    /* Defer slightly so browser scroll-restoration finishes before we check */
    setTimeout(updateJtt, 120);
    window.addEventListener("scroll", updateJtt, { passive: true });

    /* ── Devanagari Matrix Rain ── */
    class MatrixRain {
      constructor(canvasId) {
        this.canvas = document.getElementById(canvasId);
        this.ctx = this.canvas.getContext('2d');
        this.fontSize = 20;
        this.columns = [];
        this.lastWidth = window.innerWidth;
        this.resize();
        window.addEventListener('resize', () => {
          if (window.innerWidth !== this.lastWidth) {
            this.lastWidth = window.innerWidth;
            this.resize();
          }
        });
        this.animate();
      }
      
      resize() {
        const w = window.innerWidth;
        const h = window.innerHeight;
        /* Ignore mobile address bar hide/show triggers which only alter height slightly */
        if (this.canvas.width === w && Math.abs(this.canvas.height - h) < 150) return;
        
        this.canvas.width = w;
        this.canvas.height = h;
        /* Remove inline overrides just in case they were appended */
        this.canvas.style.width = '100vw';
        this.canvas.style.height = '100vh';
        
        const spacing = this.fontSize * 0.8; /* 20% higher density */
        const colCount = Math.floor(this.canvas.width / spacing);
        this.columns = [];
        for(let i=0; i<colCount; i++) {
          this.columns.push({
            x: i * spacing,
            y: (Math.random() * -2000), /* Random start above screen */
            speed: Math.random() * 0.17 + 0.06, /* 10% faster */
            nameIdx: -1,
            chars: []
          });
        }
      }
      
      animate() {
        requestAnimationFrame(() => this.animate());
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        this.ctx.font = `600 ${this.fontSize}px 'SF Pro Display', 'SF Pro Text', sans-serif`;
        
        const isDark = document.documentElement.classList.contains('dark-mode');
        const r = isDark ? 255 : 145;
        const g = isDark ? 200 : 95;
        const b = isDark ? 110 : 20;
        const maxAlpha = isDark ? 0.18 : 0.15; /* Minutely decreased dark mode, softened light mode */
        
        const nameSeq = ["म", "न", "न", "से", "ठि", "या"];

        for (let col of this.columns) {
          /* Unsteady appearance/falling speed */
          col.speed = Math.max(0.04, Math.min(0.28, col.speed + (Math.random() - 0.5) * 0.03));
          
          if (Math.random() < col.speed) {
            col.y += this.fontSize;
            
            let charStr = "";
            let isHighlight = false;
            
            /* Random chance to start the name sequence (Approx once every 2-5 min across all columns) */
            if (col.nameIdx === -1 && Math.random() < 0.000015) {
               col.nameIdx = 0;
            }
            
            if (col.nameIdx !== -1) {
               charStr = nameSeq[col.nameIdx];
               isHighlight = true;
               col.nameIdx++;
               if (col.nameIdx >= nameSeq.length) {
                   col.nameIdx = -1;
               }
            } else {
               /* Devanagari primary consonants and vowels: 2308 (\u0904) to 2361 (\u0939) */
               const charCode = Math.floor(Math.random() * 54) + 2308; 
               charStr = String.fromCharCode(charCode);
            }
            
            col.chars.unshift({
                char: charStr,
                y: col.y,
                opacity: 1.0,
                isHighlight: isHighlight
            });
          }
          if (col.y > this.canvas.height && Math.random() > 0.98) {
            col.y = Math.random() * -2000; 
            col.chars = []; 
            col.speed = Math.random() * 0.17 + 0.06;
            col.nameIdx = -1;
          }
          for (let i = col.chars.length - 1; i >= 0; i--) {
            const drop = col.chars[i];
            
            let drawAlpha = drop.opacity * maxAlpha;
            if (drop.isHighlight) {
                /* When your name appears, make it extremely opaque (brightest in dark, darkest in light) */
                drawAlpha = isDark ? (drop.opacity * 0.9) : (drop.opacity * 0.85);
            }
            
            /* Render character */
            this.ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${drawAlpha})`;
            this.ctx.fillText(drop.char, col.x, drop.y);
            
            /* Unsteady disappearing effect. Highlight (name) characters stick for much longer. */
            if (drop.isHighlight) {
                drop.opacity -= (Math.random() * 0.003 + 0.001); 
            } else {
                drop.opacity -= (Math.random() * 0.025 + 0.008); 
            }
            
            if (drop.opacity <= 0) {
                col.chars.splice(i, 1);
            }
          }
        }
      }
    }
    
    /* Initialize if supported */
    if (document.getElementById('matrix-rain')) {
      new MatrixRain('matrix-rain');
    }
  })();
</script>
