<script data-cfasync="false">
  (function () {
    try {
      var theme = localStorage.getItem('theme');
      if (theme === 'dark') {
        document.documentElement.classList.add('dark-mode');
      } else if (theme === 'royal') {
        document.documentElement.classList.add('royal-mode');
      }
    } catch (e) { }
  })();
</script>

<script data-cfasync="false">
  (function () {
    var html = document.documentElement;
    var themeToggle = document.getElementById("theme-toggle");
    var sun = document.querySelector(".sun");
    var moon = document.querySelector(".moon");
    var star = document.querySelector(".star");

    function updateIcons() {
      var isDark = html.classList.contains("dark-mode");
      var isRoyal = html.classList.contains("royal-mode");
      sun.classList.toggle("visible", !isDark && !isRoyal);
      moon.classList.toggle("visible", isDark);
      star.classList.toggle("visible", isRoyal);
    }

    updateIcons();

    themeToggle.addEventListener("click", function () {
      var isDark = html.classList.contains("dark-mode");
      var isRoyal = html.classList.contains("royal-mode");

      if (isDark) {
        /* Switch to Royal */
        html.classList.remove("dark-mode");
        html.classList.add("royal-mode");
        localStorage.setItem("theme", "royal");
      } else if (isRoyal) {
        /* Switch to Light */
        html.classList.remove("royal-mode");
        localStorage.setItem("theme", "light");
      } else {
        /* Switch to Dark */
        html.classList.add("dark-mode");
        localStorage.setItem("theme", "dark");
      }

      updateIcons();
      document.dispatchEvent(new CustomEvent("site-theme-change", {
        detail: { theme: html.classList.contains("dark-mode") ? "dark" : (html.classList.contains("royal-mode") ? "royal" : "light") }
      }));
    });

    /* ── Jump to Top ── */
    var jttBtn = document.getElementById("jump-to-top");

    jttBtn.addEventListener("click", function () {
      /* Use native smooth scroll — far lighter than jQuery animate on mobile */
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    /* Show/hide jump-to-top button — throttled via requestAnimationFrame */
    var _jttRafPending = false;
    function updateJtt() {
      if (_jttRafPending) return;
      _jttRafPending = true;
      requestAnimationFrame(function () {
        _jttRafPending = false;
        var pageIsScrollable = document.body.scrollHeight > window.innerHeight;
        var notAtTop = window.scrollY > 0;
        jttBtn.classList.toggle("visible", pageIsScrollable && notAtTop);
      });
    }

    /* Defer slightly so browser scroll-restoration finishes before we check */
    setTimeout(updateJtt, 120);
    window.addEventListener("scroll", updateJtt, { passive: true });

    /* ── Devanagari Matrix Rain ── */
    class MatrixRain {
      constructor(canvasId) {
        this.canvas = document.getElementById(canvasId);
        this.ctx = this.canvas.getContext('2d', { alpha: true, desynchronized: true });
        this.fontSize = 20;
        this.atlasFontSize = 20;
        this.nameSeq = ["म", "न", "न", "से", "ठि", "या"];
        this.glyphs = [];
        for (let code = 2308; code <= 2361; code++) this.glyphs.push(String.fromCharCode(code));
        for (let nameChar of this.nameSeq) {
          if (this.glyphs.indexOf(nameChar) === -1) this.glyphs.push(nameChar);
        }
        this.glyphIndex = new Map(this.glyphs.map((glyph, index) => [glyph, index]));
        this.atlas = document.createElement('canvas');
        this.atlasTheme = '';
        this.rafId = 0;
        this.lastFrame = 0;
        this.resizeTimer = 0;
        this.running = false;
        this.lastCompositeScrollY = -1;
        this.reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        this.lastWidth = window.innerWidth;
        /* Draw back-to-front. Layer 1 is the exact original rain; layers 2
           and 3 only add progressively fainter, slightly faster depth. The
           atmospheric layers render at lower internal resolution, then scale
           once during composition; this reduces their backing-store memory
           and raster work without changing their CSS size or movement. */
        this.layerConfigs = [
          { speedFactor: 1.265625, opacity: 0.25, parallax: 0.0750, resolutionScale: 0.50 },
          { speedFactor: 1.125, opacity: 0.50, parallax: 0.0375, resolutionScale: 0.75 },
          { speedFactor: 1.000, opacity: 1.00, parallax: 0.0150, resolutionScale: 1.00 }
        ];
        this.layers = this.layerConfigs.map((config) => {
          const buffer = document.createElement('canvas');
          return {
            config: config,
            canvas: buffer,
            ctx: buffer.getContext('2d', { alpha: true, desynchronized: true }),
            columns: [],
            accumulator: Math.random() * (1000 / 60)
          };
        });
        this.frame = this.frame.bind(this);
        this.handleResize = this.handleResize.bind(this);
        this.handleVisibility = this.handleVisibility.bind(this);
        this.handleTheme = this.handleTheme.bind(this);
        this.handlePageHide = this.handlePageHide.bind(this);
        this.handlePageShow = this.handlePageShow.bind(this);
        this.destroy = this.destroy.bind(this);
        this.resize();
        window.addEventListener('resize', this.handleResize, { passive: true });
        document.addEventListener('visibilitychange', this.handleVisibility);
        document.addEventListener('site-theme-change', this.handleTheme);
        window.addEventListener('pagehide', this.handlePageHide);
        window.addEventListener('pageshow', this.handlePageShow);
        window.addEventListener('beforeunload', this.destroy, { once: true });

        if (this.reduceMotion) this.drawStillFrame();
        else this.start();
      }

      themeState() {
        const isDark = document.documentElement.classList.contains('dark-mode');
        const isRoyal = document.documentElement.classList.contains('royal-mode');
        return {
          key: isRoyal ? 'royal' : (isDark ? 'dark' : 'light'),
          r: isRoyal ? 240 : (isDark ? 255 : 145),
          g: isRoyal ? 245 : (isDark ? 200 : 95),
          b: isRoyal ? 250 : (isDark ? 110 : 20),
          maxAlpha: isRoyal ? 0.15 : (isDark ? 0.18 : 0.2182125),
          highlightAlpha: isRoyal ? 0.65 : (isDark ? 0.9 : 1)
        };
      }

      buildAtlas(theme) {
        const cellWidth = 48;
        const cellHeight = 36;
        const columns = 10;
        const rows = Math.ceil(this.glyphs.length / columns);
        this.atlas.width = cellWidth * columns;
        this.atlas.height = cellHeight * rows;
        const atlasContext = this.atlas.getContext('2d');
        atlasContext.font = `600 ${this.atlasFontSize}px 'SF Pro Display', 'SF Pro Text', sans-serif`;
        atlasContext.textBaseline = 'alphabetic';
        atlasContext.fillStyle = `rgb(${theme.r}, ${theme.g}, ${theme.b})`;
        /* Blur the tiny atlas once instead of filtering the full viewport on
           every animation frame. The glyph softness remains the same. */
        if ('filter' in atlasContext) atlasContext.filter = 'blur(1px)';
        for (let index = 0; index < this.glyphs.length; index++) {
          const x = (index % columns) * cellWidth + 2;
          const y = Math.floor(index / columns) * cellHeight + 25;
          atlasContext.fillText(this.glyphs[index], x, y);
        }
        this.atlasTheme = theme.key;
      }

      handleResize() {
        window.clearTimeout(this.resizeTimer);
        this.resizeTimer = window.setTimeout(() => {
          if (window.innerWidth !== this.lastWidth || Math.abs(this.canvas.height - window.innerHeight) >= 150) {
            this.lastWidth = window.innerWidth;
            this.resize();
          }
        }, 140);
      }

      handleVisibility() {
        if (document.hidden) this.stop();
        else if (this.reduceMotion) this.drawStillFrame();
        else this.start();
      }

      handleTheme() {
        this.atlasTheme = '';
        this.lastCompositeScrollY = -1;
        for (const layer of this.layers) {
          layer.ctx.clearRect(0, 0, layer.canvas.width, layer.canvas.height);
        }
        if (this.reduceMotion || !this.running) this.drawStillFrame();
      }

      releaseBackingStores() {
        /* Explicitly release the four viewport-sized canvas allocations before
           reload/BFCache retention. Compressed images are small; these raw
           RGBA surfaces are the site's largest per-tab memory allocation. */
        this.canvas.width = 1;
        this.canvas.height = 1;
        this.atlas.width = 1;
        this.atlas.height = 1;
        this.atlasTheme = '';
        this.lastCompositeScrollY = -1;
        for (const layer of this.layers) {
          layer.canvas.width = 1;
          layer.canvas.height = 1;
          layer.columns = [];
          layer.accumulator = Math.random() * (1000 / 60);
        }
      }

      handlePageHide() {
        this.stop();
        window.clearTimeout(this.resizeTimer);
        this.releaseBackingStores();
      }

      handlePageShow(event) {
        if (!event.persisted) return;
        this.lastWidth = window.innerWidth;
        this.resize();
        if (this.reduceMotion) this.drawStillFrame();
        else this.start();
      }

      start() {
        if (this.running || document.hidden || this.reduceMotion) return;
        this.running = true;
        this.lastFrame = 0;
        this.rafId = requestAnimationFrame(this.frame);
      }

      stop() {
        this.running = false;
        if (this.rafId) cancelAnimationFrame(this.rafId);
        this.rafId = 0;
      }

      destroy() {
        this.stop();
        window.clearTimeout(this.resizeTimer);
        window.removeEventListener('resize', this.handleResize);
        document.removeEventListener('visibilitychange', this.handleVisibility);
        document.removeEventListener('site-theme-change', this.handleTheme);
        window.removeEventListener('pagehide', this.handlePageHide);
        window.removeEventListener('pageshow', this.handlePageShow);
        this.releaseBackingStores();
      }

      frame(timestamp) {
        if (!this.running) return;
        const deltaMs = this.lastFrame ? Math.min(50, timestamp - this.lastFrame) : (1000 / 60);
        this.lastFrame = timestamp;
        const theme = this.themeState();
        if (theme.key !== this.atlasTheme) this.buildAtlas(theme);
        let layerChanged = false;
        for (const layer of this.layers) {
          layer.accumulator += deltaMs;
          let updates = 0;
          while (layer.accumulator >= (1000 / 60) && updates < 3) {
            this.updateLayer(layer, theme, 1);
            layer.accumulator -= (1000 / 60);
            updates++;
            layerChanged = true;
          }
        }
        const scrollY = window.scrollY || window.pageYOffset || 0;
        if (layerChanged || scrollY !== this.lastCompositeScrollY) {
          this.composite(theme);
          this.lastCompositeScrollY = scrollY;
        }
        this.rafId = requestAnimationFrame(this.frame);
      }

      resize() {
        const w = window.innerWidth;
        const h = window.innerHeight;
        /* Ignore mobile address bar hide/show triggers which only alter height slightly */
        if (this.canvas.width === w && Math.abs(this.canvas.height - h) < 150) return;

        this.canvas.width = w;
        this.canvas.height = h;
        /* Remove inline overrides just in case they were appended */
        this.canvas.style.width = '100vw';
        this.canvas.style.height = '100vh';
        this.lastCompositeScrollY = -1;

        for (const layer of this.layers) {
          const resolutionScale = layer.config.resolutionScale || 1;
          layer.canvas.width = Math.ceil(w * resolutionScale);
          layer.canvas.height = Math.ceil(h * resolutionScale);
          layer.columns = [];
          const spacing = this.fontSize * 0.8;
          const colCount = Math.ceil(w / spacing) + 1;
          for (let index = 0; index < colCount; index++) {
            layer.columns.push({
              x: index * spacing,
              y: Math.random() * -2000,
              speed: Math.random() * 0.17 + 0.06,
              nameIdx: -1,
              chars: []
            });
          }
        }
      }

      chance(probabilityAt60Hz, frameScale) {
        return Math.random() < 1 - Math.pow(1 - probabilityAt60Hz, frameScale);
      }

      updateLayer(layer, theme, frameScale) {
        const context = layer.ctx;
        const config = layer.config;
        const resolutionScale = config.resolutionScale || 1;
        const cellWidth = 48;
        const cellHeight = 36;
        const atlasColumns = 10;
        context.setTransform(1, 0, 0, 1, 0, 0);
        context.clearRect(0, 0, layer.canvas.width, layer.canvas.height);
        context.setTransform(resolutionScale, 0, 0, resolutionScale, 0, 0);

        for (const column of layer.columns) {
          column.speed = Math.max(0.04, Math.min(0.28,
            column.speed + (Math.random() - 0.5) * 0.03 * Math.sqrt(frameScale)
          ));

          /* Multiplying speed in probability space retains the old irregular
             cadence while making only the rear layers 12.5% faster. */
          const movementChance = 1 - Math.pow(1 - column.speed, config.speedFactor);
          if (this.chance(movementChance, frameScale)) {
            column.y += this.fontSize;
            let glyph;
            let highlighted = false;
            if (column.nameIdx === -1 && this.chance(0.000015, frameScale)) column.nameIdx = 0;
            if (column.nameIdx !== -1) {
              glyph = this.nameSeq[column.nameIdx++];
              highlighted = true;
              if (column.nameIdx >= this.nameSeq.length) column.nameIdx = -1;
            } else {
              glyph = String.fromCharCode(Math.floor(Math.random() * 54) + 2308);
            }
            column.chars.unshift({ char: glyph, y: column.y, opacity: 1, isHighlight: highlighted });
            if (column.chars.length > 24) column.chars.length = 24;
          }

          if (column.y > this.canvas.height && this.chance(0.02, frameScale)) {
            column.y = Math.random() * -2000;
            column.speed = Math.random() * 0.17 + 0.06;
            column.nameIdx = -1;
            column.chars = [];
          }

          for (let index = column.chars.length - 1; index >= 0; index--) {
            const drop = column.chars[index];
            const glyphIndex = this.glyphIndex.get(drop.char) || 0;
            const sourceX = (glyphIndex % atlasColumns) * cellWidth;
            const sourceY = Math.floor(glyphIndex / atlasColumns) * cellHeight;
            context.globalAlpha = drop.opacity * (drop.isHighlight ? theme.highlightAlpha : theme.maxAlpha);
            context.drawImage(this.atlas, sourceX, sourceY, cellWidth, cellHeight, column.x - 2, drop.y - 25, cellWidth, cellHeight);

            if (drop.isHighlight) drop.opacity -= (Math.random() * 0.003 + 0.001) * frameScale;
            else drop.opacity -= (Math.random() * 0.025 + 0.008) * frameScale;
            if (drop.opacity <= 0) column.chars.splice(index, 1);
          }
        }
        context.globalAlpha = 1;
        context.setTransform(1, 0, 0, 1, 0, 0);
      }

      composite(theme) {
        const height = this.canvas.height;
        const scrollY = window.scrollY || window.pageYOffset || 0;
        this.ctx.clearRect(0, 0, this.canvas.width, height);
        for (let layerIndex = 0; layerIndex < this.layers.length; layerIndex++) {
          const layer = this.layers[layerIndex];
          const offset = -((scrollY * layer.config.parallax) % height);
          let opacityMultiplier = 1;
          if (theme.key === 'light') {
            /* maxAlpha carries the shared light-theme increase; retain the
               existing extra rear/middle depth weighting. */
            if (layerIndex === 0) opacityMultiplier = 1.090909;
            else if (layerIndex === 1) opacityMultiplier = 1.045455;
          } else {
            if (layerIndex === 0) opacityMultiplier = 1.15;
            else if (layerIndex === 1) opacityMultiplier = 1.10;
          }
          this.ctx.globalAlpha = Math.min(1, layer.config.opacity * opacityMultiplier);
          this.ctx.drawImage(layer.canvas, 0, offset, this.canvas.width, height);
          this.ctx.drawImage(layer.canvas, 0, offset + height, this.canvas.width, height);
        }
        this.ctx.globalAlpha = 1;
      }

      drawStillFrame() {
        const theme = this.themeState();
        if (theme.key !== this.atlasTheme) this.buildAtlas(theme);
        for (const layer of this.layers) this.updateLayer(layer, theme, 1);
        this.composite(theme);
      }
    }

    /* Initialize if supported */
    if (document.getElementById('matrix-rain')) {
      new MatrixRain('matrix-rain');
    }
  })();
</script>
