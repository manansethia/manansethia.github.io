<!-- BEGIN THEME TOGGLE BUTTON -->
<style>
    .theme-toggle {
      position: fixed;
      bottom: 100px;
      right: 20px;
      z-index: 1000;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      width: 55px;
      height: 55px;
    }
  
    .theme-toggle .sun-moon-container {
      width: 100%;
      height: 100%;
      background-color: #eea316; /* warm sun bg */
      border-radius: 16px; /* rounded square */
      border: 3px solid #c78400;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.4s ease, border-color 0.3s ease;
    }
  
    .icon {
      position: absolute;
      top: 12.25%;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      width: 37px;
      height: 37px;
      transition: opacity 0.3s ease, transform 0.3s ease, stroke 0.3s ease;
      opacity: 0;
      transform: scale(0.8);
    }
  
    .icon.sun.visible {
      opacity: 1;
      transform: scale(1);
      stroke: #fef9e7;
    }
  
    .icon.moon.visible {
      opacity: 1;
      transform: scale(1);
      stroke: #ccc;
    }
  
    .dark-mode .theme-toggle .sun-moon-container {
      background-color: #3e3e3e;
      border-color: #959595;
    }
  
    .dark-mode .icon.sun {
      stroke: #fef9e7;
    }
  
    .dark-mode .icon.moon {
      stroke: #ccc;
    }
  
    /* Dark theme site styles */
    .dark-mode {
      background-color: #020202;
      color: #fdfdfd;
    }

    .dark-mode .greedy-nav button {
        background-color: #ffffff;
    }

    .dark-mode .navicon, .dark-mode .navicon:before, .dark-mode .navicon:after {
        background-color: #000000;
    }

    .dark-mode .close .navicon{
        background: transparent;
    }

    .dark-mode .greedy-nav a:hover{
        color:#ffdc9b
    }
  
    .dark-mode a {
      color: #fdfdfd;
    }
  
    .dark-mode .page__footer {
      background-color: #3e3e3e;
      border-top: 2px solid #dadada;
    }

    .dark-mode .page__footer footer {
      color: #eeeeee;
    }
  
    .dark-mode .masthead, .dark-mode .greedy-nav{
      background-color: #663d00;
      color: #fdfdfd;
    }

    

    .dark-mode .site-nav {
      background-color: #020202;
      color: #fdfdfd;
    }

    .dark-mode .page__content {
      background-color: #020202;
      color: #fdfdfd;
    }
  
    .dark-mode .site-title {
      color: #ffffff;
    }

    .dark-mode .site-nav a {
      color: #ffffff;
    }
  </style>
  
  <script>
    (function () {
      try {
        if (localStorage.getItem('theme') === 'dark') {
          document.documentElement.classList.add('dark-mode');
        }
      } catch (e) {}
    })();
  </script>
  
  <button id="theme-toggle" class="theme-toggle" aria-label="Toggle Dark Mode">
    <div class="sun-moon-container">
      <svg class="sun icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="5"></circle>
        <line x1="12" y1="1" x2="12" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line>
        <line x1="21" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
      </svg>
      <svg class="moon icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </div>
  </button>
  
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const themeToggle = document.getElementById("theme-toggle");
      const sun = document.querySelector(".sun");
      const moon = document.querySelector(".moon");
  
      function updateIcons() {
        const isDark = document.documentElement.classList.contains("dark-mode");
        sun.classList.toggle("visible", !isDark);
        moon.classList.toggle("visible", isDark);
      }
  
      updateIcons();
  
      themeToggle.addEventListener("click", function () {
        document.documentElement.classList.toggle("dark-mode");
        localStorage.setItem(
          "theme",
          document.documentElement.classList.contains("dark-mode") ? "dark" : "light"
        );
        updateIcons();
      });
    });
  </script>
  <!-- END THEME TOGGLE BUTTON -->
