<!-- BEGIN THEME TOGGLE BUTTON -->
<style>
    @media (min-width: 57.8125em) {
      .page {
        padding-right: 5%;
        padding-left: 5%;
      }
    }

    html {
      background-color: #fffbeb;
    }

    .theme-toggle {
      position: fixed;
      bottom: 100px;
      right: 20px;
      z-index: 1000;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      width: 55px;
      height: 55px;
    }
  
    .theme-toggle .sun-moon-container {
      width: 100%;
      height: 100%;
      background-color: #eea316; /* warm sun bg */
      border-radius: 16px; /* rounded square */
      border: 3px solid #c78400;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.4s ease, border-color 0.3s ease;
    }
  
    .icon {
      position: absolute;
      top: 12.25%;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      width: 37px;
      height: 37px;
      transition: opacity 0.3s ease, transform 0.3s ease, stroke 0.3s ease;
      opacity: 0;
      transform: scale(0.8);
    }
  
    .icon.sun.visible {
      opacity: 1;
      transform: scale(1);
      stroke: #fff7dc;
    }
  
    .icon.moon.visible {
      opacity: 1;
      transform: scale(1);
      stroke: #ffe6c4;
    }
  
    .dark-mode .theme-toggle .sun-moon-container {
      background-color: #554125;
      border-color: #fff5e7;
    }
  
    .dark-mode .icon.sun {
      stroke: #fff7dc;
    }
  
    .dark-mode .icon.moon {
      stroke: #ffe6c4;
    }
  
    /* Dark theme site styles */
    .dark-mode {
      background-color: #120c00;;
      color: #fdfdfd;
    }

    .dark-mode .greedy-nav button{
        background-color: #ffe6c4;;
    }

    .dark-mode .greedy-nav .hidden-links:before{
      border-color: #ffe6c4 transparent;
    }

    .dark-mode .navicon, .dark-mode .navicon:before, .dark-mode .navicon:after {
        background-color: #663d00;
    }

    .dark-mode .close .navicon{
        background: transparent;
    }

    .dark-mode .greedy-nav a:hover{
        color:#ffdc9b
    }

    .dark-mode .greedy-nav .visible-links a:before{
        background: #ffdc9b;
    }
  
    .dark-mode a {
      color: #fdfdfd;
    }
  
    .dark-mode .page__footer {
      background-color: #554125;
      border-top: 2px solid #ffdc9b;
    }

    .dark-mode .page__footer footer {
      color: #eeeeee;
    }
  
    .dark-mode .masthead{
      background-color: #663d00;
      color: #fdfdfd;
      border-bottom: 2px solid #ffe6c4;;
    }

    .dark-mode .greedy-nav{
      background-color: #663d00;
      color: #fdfdfd;
    }

    .dark-mode .author__content, .dark-mode .author__urls, .dark-mode .social-icons .fa-github{
        color: #fdfdfd;
    }

    @media (min-width: 925px) {
      .dark-mode .author__urls {
          background: transparent !important;
          box-shadow: none !important;
          border: none !important; 
      }
    }

    .dark-mode .author__urls{
      background: #543200;
      border: 1px solid #ffe6c4;
    }

    .dark-mode .author__urls:after, .dark-mode .author__urls:before {
      border-color: #ffe6c4 transparent;
    }

    .dark-mode .social-icons .fa-instagram {
        color: #ad2bff;
    }    

    .dark-mode .social-icons .fa-linkedin, .social-icons .fa-linkedin-square {
    color: #00acff;
    }

    @media (min-width: 57.8125em) {
      .dark-mode .author__avatar img {
        border: 3px solid #ffae34 !important;
      }
    }

    .dark-mode .author__avatar img {
      max-width: 175px;  
      border: 2px solid #ffae34;
    }

    .dark-mode .greedy-nav .hidden-links{
        background: #663d00;
        border: 2px solid #ffe6c4;
        box-shadow: 0 0 10px rgb(255 255 255 / 25%);
    }

    .dark-mode .greedy-nav .hidden-links li {
      border-bottom: 1.5px solid #ffe6c4;
    }

    .dark-mode .greedy-nav .hidden-links li:last-child {
        border-bottom: none;
    }

    .dark-mode .greedy-nav .hidden-links:after {
      border-color: #ffe6c4 transparent;
    }

    .btn--inverse:hover {
      box-shadow: #000000 0 0 0.3rem;
      color: #e9a700 !important;
      border: 2px solid  #060400 !important;
      background-color: #5f3900; 
    }

    .btn--inverse {
      color: #e9a700 !important;
      border: 2px solid  #060400 !important;
      background-color: #5f3900; 
    }

    .dark-mode .btn--inverse:hover {
      box-shadow: #fff5e7 0 0 0.3rem;
      background-color: #ffefcc !important;  
      color: #663d00 !important;
      border: 2px solid #ffaa2a !important;
    }

    .dark-mode .btn--inverse {
      background-color: #ffefcc !important;  
      color: #663d00 !important;
      border: 2px solid #ffaa2a !important;
    }

    .dark-mode h1, .dark-mode h2, .dark-mode h3, .dark-mode h4, .dark-mode h5, .dark-mode h6 {
      color: #fdfdfd;
    }

    .dark-mode .page__content h2 {
      border-bottom: 1px solid #ffae34;
    }

    .dark-mode .site-nav {
      background-color: #120c00;;
      color: #fdfdfd;
    }

    .dark-mode .page__content {
      background-color: #120c00;;
      color: #fdfdfd;
    }
  
    .dark-mode .site-title {
      color: #ffffff;
    }

    .dark-mode .site-nav a {
      color: #ffffff;
    }

    .dark-mode ::selection {
      background: #fdfdfd;
      color: #000;
    }

    .dark-mode .edu-divider{
      background-color: #ffae34;
    }

    .dark-mode .achievement-meta {
      color: rgb(255 223 192);
    }

    .dark-mode .achievement-images-text{
      color: #fdfdfd;
    }

    .dark-mode .episode-card-news span{
      color: #fdfdfd;
    }

    .dark-mode .episode-card span{
      color: rgb(237, 130, 54);
    }

    .dark-mode .dashed-line {
      color: #e6c194;
    }

    .dark-mode hr.silver-line{
      background-color: #e6c194;
    }

    .pdf-frame {
      border: 3px solid #4c2d00;
    }

    .dark-mode .pdf-frame {
      border-color: #d39c2e;
    }
  </style>
  
  <script>
    (function () {
      try {
        if (localStorage.getItem('theme') === 'dark') {
          document.documentElement.classList.add('dark-mode');
        }
      } catch (e) {}
    })();
  </script>
  
  <button id="theme-toggle" class="theme-toggle" aria-label="Toggle Dark Mode">
    <div class="sun-moon-container">
      <svg class="sun icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="5"></circle>
        <line x1="12" y1="1" x2="12" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line>
        <line x1="21" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
      </svg>
      <svg class="moon icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </div>
  </button>
  
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const themeToggle = document.getElementById("theme-toggle");
      const sun = document.querySelector(".sun");
      const moon = document.querySelector(".moon");
  
      function updateIcons() {
        const isDark = document.documentElement.classList.contains("dark-mode");
        sun.classList.toggle("visible", !isDark);
        moon.classList.toggle("visible", isDark);
      }
  
      updateIcons();
  
      themeToggle.addEventListener("click", function () {
        document.documentElement.classList.toggle("dark-mode");
        localStorage.setItem(
          "theme",
          document.documentElement.classList.contains("dark-mode") ? "dark" : "light"
        );
        updateIcons();
      });
    });
  </script>
  <!-- END THEME TOGGLE BUTTON -->
