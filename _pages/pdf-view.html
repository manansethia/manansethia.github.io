<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Viewer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: white;
            overflow-x: hidden; /* Prevents horizontal scrolling */
        }
        .pdf-container {
            width: 100vw;  /* Full width */
            max-width: 100%;
            height: auto;
            overflow-y: scroll;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        canvas {
            width: 100vw !important;  /* Makes PDF pages fill the screen */
            height: auto;
            display: block;
        }
    </style>
</head>
<body>

<div class="pdf-container" id="pdf-container"></div>

<script>
    let pdfURL = "https://manansethia.github.io/files/MRIDA.pdf";
    let pdfDoc = null;
    let scaleFactor = 5;  // Increase for better clarity

    function renderPDF() {
        pdfjsLib.getDocument(pdfURL).promise.then(pdf => {
            pdfDoc = pdf;
            let container = document.getElementById("pdf-container");

            for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                pdf.getPage(pageNum).then(page => {
                    let viewport = page.getViewport({ scale: scaleFactor });
                    let canvas = document.createElement("canvas");
                    let context = canvas.getContext("2d");

                    // Adjust canvas width to fit screen
                    canvas.width = window.innerWidth;  
                    canvas.height = (viewport.height / viewport.width) * canvas.width;  
                    
                    container.appendChild(canvas);

                    let renderContext = {
                        canvasContext: context,
                        viewport: page.getViewport({ scale: canvas.width / viewport.width })
                    };

                    page.render(renderContext);
                });
            }
        }).catch(error => {
            console.error("Error loading PDF:", error);
        });
    }

    renderPDF();
</script>

</body>
</html>
