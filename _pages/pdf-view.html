<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Viewer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: white;
            overflow-x: hidden;
            /* ✅ Allow full vertical scrolling */
        }

        .pdf-container {
            width: 100vw;
            min-height: 100vh;
            /* ✅ Expand naturally */
            overflow-y: auto;
            /* ✅ Enable scrolling */
            display: block;
            background-color: white;
        }

        canvas {
            display: block;
            width: 100vw;
            height: auto;
            background-color: #ffffff;
            border: none;
        }
    </style>
</head>

<body>

    <div class="pdf-container" id="pdf-container"></div>

    <script>
        let pdfURL = "/files/MRIDA.pdf";
        let scaleFactor = 5;  // ✅ Balanced for quality & performance

        async function renderPDF() {
            let pdfDoc = await pdfjsLib.getDocument(pdfURL).promise;
            let container = document.getElementById("pdf-container");

            for (let pageNum = 1; pageNum <= pdfDoc.numPages; pageNum++) {
                let page = await pdfDoc.getPage(pageNum);
                let viewport = page.getViewport({ scale: scaleFactor });

                let canvas = document.createElement("canvas");
                let context = canvas.getContext("2d");

                canvas.width = viewport.width;
                canvas.height = viewport.height;

                container.appendChild(canvas);

                let renderContext = {
                    canvasContext: context,
                    viewport: viewport
                };

                await page.render(renderContext);
            }
        }

        renderPDF();
    </script>

</body>

</html>
