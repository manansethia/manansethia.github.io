<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High-Quality PDF Viewer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f8f8f8;
        }
        .pdf-container {
            width: 80%;
            max-width: 900px;
            height: 90vh;
            overflow-y: scroll;
            border: 2px solid #000;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.2);
            background: white;
            padding: 10px;
        }
        canvas {
            width: 100%;
            display: block;
        }
    </style>
</head>
<body>

<div class="pdf-container" id="pdf-container"></div>

<script>
    let pdfURL = "https://manansethia.github.io/files/MRIDA.pdf";
    let pdfDoc = null;
    let scaleFactor = 3;  // ⬆️ Increase this for better text clarity

    function renderPDF() {
        pdfjsLib.getDocument(pdfURL).promise.then(pdf => {
            pdfDoc = pdf;
            let container = document.getElementById("pdf-container");

            for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                pdf.getPage(pageNum).then(page => {
                    let viewport = page.getViewport({ scale: scaleFactor });  // ⬆️ Higher scale for sharp text
                    let canvas = document.createElement("canvas");
                    let context = canvas.getContext("2d");

                    canvas.height = viewport.height;
                    canvas.width = viewport.width;
                    container.appendChild(canvas);

                    let renderContext = {
                        canvasContext: context,
                        viewport: viewport
                    };

                    page.render(renderContext);
                });
            }
        }).catch(error => {
            console.error("Error loading PDF:", error);
        });
    }

    renderPDF();
</script>

</body>
</html>
